# Project identification
sonar.projectKey=homeassistant-core
sonar.projectName=Home Assistant Core
sonar.projectVersion=1.0

# Source and language
sonar.language=py
sonar.sources=homeassistant
sonar.exclusions=tests/**,**/__pycache__/**

# Unit tests & coverage
sonar.python.xunit.reportPath=reports/pytest.xml
sonar.python.coverage.reportPaths=reports/coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8
